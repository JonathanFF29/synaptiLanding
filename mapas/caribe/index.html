async function abrir(llave,raw,rec){
  const b=Uint8Array.from(atob(DATO),c=>c.charCodeAt(0));
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},llave,b.slice(12)));
  if(raw){try{sessionStorage.setItem(K,raw);if(rec)localStorage.setItem(K,raw);}catch(e){}}
  document.open();document.write(html);document.close();}
async function conRaw(raw){const k=await crypto.subtle.importKey("raw",Uint8Array.from(atob(raw),c=>c.charCodeAt(0)),"AES-GCM",false,["decrypt"]);return k;}
(async()=>{let raw=null;try{raw=sessionStorage.getItem(K)||localStorage.getItem(K);}catch(e){}
  if(raw){try{await abrir(await conRaw(raw),null);return;}catch(e){try{sessionStorage.removeItem(K);localStorage.removeItem(K);}catch(_){}}}})();
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const bt=document.getElementById("b"),er=document.getElementById("err");
  bt.disabled=true;bt.textContent="Verificando…";er.textContent="";
  try{const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(document.getElementById("c").value),"PBKDF2",false,["deriveKey"]);
    const llave=await crypto.subtle.deriveKey({name:"PBKDF2",salt:SAL,iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
    const raw=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw",llave))));
    await abrir(llave,raw,document.getElementById("r").checked);}
  catch(x){er.textContent="Contraseña incorrecta.";bt.disabled=false;bt.textContent="Entrar";document.getElementById("c").select();}};
</script></body></html>
